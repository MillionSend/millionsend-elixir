name: release

# Publishes to Hex. Hex has no OIDC trusted publishing, so this needs a
# HEX_API_KEY repository secret (hex.pm → dashboard → keys, write scope).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag publishes exactly the version the manifest declares; a tag that
      # disagrees with it is refused instead of shipping the wrong number.
      - name: Tag must match the manifest version
        if: github.ref_type == 'tag'
        run: test "v$(sed -n 's/.*@version "\(.*\)"/\1/p' mix.exs)" = "$GITHUB_REF_NAME"
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: "1.16"
          otp-version: "26"
      - run: mix deps.get
      - run: mix test
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
